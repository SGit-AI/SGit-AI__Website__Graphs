<text x="60" y="128" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="22" fill="#f7f4ec">“in our graph we do not use properties,</text>
<text x="60" y="162" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="22" fill="#f7f4ec">because properties do not have meaning,</text>
<text x="60" y="196" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="22" fill="#f7f4ec">they are just words; we capture</text>
<text x="60" y="230" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="22" fill="#f7f4ec">meaning through connectivity.”</text>
<text x="60" y="272" font-family="'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="11.5" letter-spacing="2" fill="rgba(247,244,236,0.55)">&#8212; DINIS CRUZ, 26 JUNE 2026</text>
<text x="60" y="316" font-family="'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#e2a24f">THE CLAIM</text>
<text x="60" y="342" font-family="Georgia, 'Liberation Serif', serif" font-size="15.5" fill="rgba(247,244,236,0.88)">A node is just a node. The same value, differently</text>
<text x="60" y="365" font-family="Georgia, 'Liberation Serif', serif" font-size="15.5" fill="rgba(247,244,236,0.88)">connected, means different things: the difference is</text>
<text x="60" y="388" font-family="Georgia, 'Liberation Serif', serif" font-size="15.5" fill="rgba(247,244,236,0.88)">not in the value, it is in the connectivity.</text>
<text x="60" y="429" font-family="'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#e2a24f">THE GRAMMAR</text>
<text x="60" y="455" font-family="Georgia, 'Liberation Serif', serif" font-size="15.5" fill="rgba(247,244,236,0.88)">Every edge is a verb with a distinct inverse. Paths</text>
<text x="60" y="478" font-family="Georgia, 'Liberation Serif', serif" font-size="15.5" fill="rgba(247,244,236,0.88)">read as sentences. And never render the whole graph:</text>
<text x="60" y="501" font-family="Georgia, 'Liberation Serif', serif" font-size="15.5" fill="rgba(247,244,236,0.88)">render the result of a query.</text>
<text x="60" y="542" font-family="'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#e2a24f">THE PROOF</text>
<text x="60" y="568" font-family="Georgia, 'Liberation Serif', serif" font-size="15.5" fill="rgba(247,244,236,0.88)">Real worked graphs with real numbers, including</text>
<text x="60" y="591" font-family="Georgia, 'Liberation Serif', serif" font-size="15.5" fill="rgba(247,244,236,0.88)">three live vaults you can open and count.</text>
<text x="60" y="632" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="14.5" fill="rgba(247,244,236,0.6)">Written by Dinis Cruz with a team of AI agents,</text>
<text x="60" y="653" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="14.5" fill="rgba(247,244,236,0.6)">from voice memos developed into 1,300+ briefs</text>
<text x="60" y="674" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="14.5" fill="rgba(247,244,236,0.6)">across a 3,300-document corpus. The living version</text>
<text x="60" y="695" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="14.5" fill="rgba(247,244,236,0.6)">is graphs.sgit.ai; this book is generated from it,</text>
<text x="60" y="716" font-family="Georgia, 'Liberation Serif', serif" font-style="italic" font-size="14.5" fill="rgba(247,244,236,0.6)">and cannot drift from it.</text>
<text x="60" y="747" font-family="'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#e2a24f">FIRST EDITION &#183; SITE V0.3.12 &#183; 21 AUGUST 2026</text>
